services:

  proxy:
    image: traefik:3.6
    ports:
      - "80:80"
      - "443:443"

  adminer:
    profiles: ["dev-tools"]
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - traefik.enable=false

  prestart:
    environment:
      FASTAPI_ENV: "development"
      ENABLE_DEMO_AUTH: "true"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - dev
      - --host
      - "0.0.0.0"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
        - path: ./frontend
          action: rebuild
          ignore:
            - ./frontend/node_modules
            - ./frontend/dist
            - ./frontend/blob-report
            - ./frontend/test-results
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      FASTAPI_ENV: "development"
      # Synthetic persona auth is an explicit local-development boundary.
      # Production compose leaves ENABLE_DEMO_AUTH unset/false.
      ENABLE_DEMO_AUTH: "true"
      FRONTEND_HOST: https://${DOMAIN:-localhost}
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"

  ai-worker:
    environment:
      FASTAPI_ENV: "development"
      ENABLE_DEMO_AUTH: "true"

  mailpit:
    image: axllent/mailpit

  playwright:
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - NODE_ENV=production
    ipc: host
    depends_on:
      - proxy
      - backend
      - mailpit
    environment:
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:?Variable not set}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      - PLAYWRIGHT_BASE_URL=https://proxy
      - VITE_API_URL=
      - MAILPIT_HOST=http://mailpit:8025
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI:-}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results
