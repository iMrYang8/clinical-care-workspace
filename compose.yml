x-bounded-container-logging: &bounded-container-logging
  driver: local
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-20m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

services:

  proxy:
    image: traefik:3.6
    logging: *bounded-container-logging
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # A Docker socket is global to the host. Scope discovery to this exact
      # Compose project so parallel checkouts/CI runs with the same Host rule
      # can never be selected as this proxy's backend.
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)'
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # With no resolver configured Traefik generates a local self-signed cert.
      - --entrypoints.https.address=:443
      # Keep only operational fields. RequestPath/RequestURI, headers and query
      # strings are intentionally absent so patient identifiers cannot enter the
      # proxy access sink.
      - --accesslog
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:16
    logging: *bounded-container-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - nightingale-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  prestart:
    # Local development keeps the conventional tag. Production overrides this
    # with a SHA tag for build and then the inspected immutable image ID.
    image: ${NIGHTINGALE_BACKEND_IMAGE:-backend:latest}
    logging: *bounded-container-logging
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      # Production is the base configuration. compose.override.yml is the only
      # file that opts the local one-command workflow into synthetic demo data.
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
      NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-disabled}
      NOTIFICATION_WHATSAPP_PROVIDER: ${NOTIFICATION_WHATSAPP_PROVIDER:-disabled}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-nightingale-notification-webhook-local}
      NOTIFICATION_PUBLIC_BASE_URL: ${NOTIFICATION_PUBLIC_BASE_URL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_API_BASE_URL: ${TWILIO_API_BASE_URL:-https://api.twilio.com}
      EXTERNAL_PROXY_RETENTION_DAYS: ${EXTERNAL_PROXY_RETENTION_DAYS:-30}
      EXTERNAL_CONTAINER_RETENTION_DAYS: ${EXTERNAL_CONTAINER_RETENTION_DAYS:-30}
      EXTERNAL_APM_RETENTION_DAYS: ${EXTERNAL_APM_RETENTION_DAYS:-30}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE:-unqualified}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID:-}
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Variable not set}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NIGHTINGALE_SOURCE_COMMIT: ${NIGHTINGALE_SOURCE_COMMIT:-unknown}
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    command: ["bash", "scripts/prestart.sh"]
    restart: "no"

  backend:
    logging: *bounded-container-logging
    image: ${NIGHTINGALE_BACKEND_IMAGE:-backend:latest}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
      NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-disabled}
      NOTIFICATION_WHATSAPP_PROVIDER: ${NOTIFICATION_WHATSAPP_PROVIDER:-disabled}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-nightingale-notification-webhook-local}
      NOTIFICATION_PUBLIC_BASE_URL: ${NOTIFICATION_PUBLIC_BASE_URL:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_SUBMITTED_STALE_SECONDS: ${NOTIFICATION_SUBMITTED_STALE_SECONDS:-900}
      NOTIFICATION_CONNECT_TIMEOUT_SECONDS: ${NOTIFICATION_CONNECT_TIMEOUT_SECONDS:-5}
      NOTIFICATION_REQUEST_TIMEOUT_SECONDS: ${NOTIFICATION_REQUEST_TIMEOUT_SECONDS:-15}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_API_BASE_URL: ${TWILIO_API_BASE_URL:-https://api.twilio.com}
      # The long-running API receives only the restricted, non-owner role.
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      REMOTE_TEXT_EGRESS_ENABLED: ${REMOTE_TEXT_EGRESS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACT_MODEL: ${OPENAI_EXTRACT_MODEL:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      REMOTE_CONNECT_TIMEOUT_SECONDS: ${REMOTE_CONNECT_TIMEOUT_SECONDS:-5}
      REMOTE_FIRST_RESULT_TIMEOUT_SECONDS: ${REMOTE_FIRST_RESULT_TIMEOUT_SECONDS:-15}
      REMOTE_REQUEST_TIMEOUT_SECONDS: ${REMOTE_REQUEST_TIMEOUT_SECONDS:-30}
      AI_TEXT_JOB_TIMEOUT_SECONDS: ${AI_TEXT_JOB_TIMEOUT_SECONDS:-75}
      AI_JOB_LEASE_SECONDS: ${AI_JOB_LEASE_SECONDS:-300}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-true}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-2}
      AI_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${AI_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}
      PRESIDIO_REQUIRED: ${PRESIDIO_REQUIRED:-true}
      PRESIDIO_NLP_MODEL: ${PRESIDIO_NLP_MODEL:-en_core_web_sm}
      OBSERVABILITY_RETENTION_DAYS: ${OBSERVABILITY_RETENTION_DAYS:-30}
      OPERATIONAL_EVENT_DB_PATH: /var/lib/nightingale/operational-events/events.sqlite3
      OPERATIONAL_EVENT_PURGE_INTERVAL_SECONDS: ${OPERATIONAL_EVENT_PURGE_INTERVAL_SECONDS:-3600}
      EXTERNAL_PROXY_RETENTION_DAYS: ${EXTERNAL_PROXY_RETENTION_DAYS:-30}
      EXTERNAL_CONTAINER_RETENTION_DAYS: ${EXTERNAL_CONTAINER_RETENTION_DAYS:-30}
      EXTERNAL_APM_RETENTION_DAYS: ${EXTERNAL_APM_RETENTION_DAYS:-30}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE:-unqualified}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID:-}
      IMPORTANCE_LEARNING_MODE: ${IMPORTANCE_LEARNING_MODE:-shadow}
      DATA_DECAY_ENABLED: ${DATA_DECAY_ENABLED:-true}
      DATA_DECAY_DRY_RUN: ${DATA_DECAY_DRY_RUN:-true}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-local}
      REMOTE_AUDIO_EGRESS_ENABLED: ${REMOTE_AUDIO_EGRESS_ENABLED:-false}
      STRICT_NO_AUDIO_EGRESS: ${STRICT_NO_AUDIO_EGRESS:-false}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      LOCAL_ASR_MODEL_DIR: ${LOCAL_ASR_MODEL_DIR:-}
      PYANNOTE_ENABLED: ${PYANNOTE_ENABLED:-false}
      PYANNOTE_MODEL_DIR: ${PYANNOTE_MODEL_DIR:-}
      LIVE_TRANSCRIPT_ENABLED: ${LIVE_TRANSCRIPT_ENABLED:-false}
      LIVE_TRANSCRIPT_PROVIDER: ${LIVE_TRANSCRIPT_PROVIDER:-disabled}
      LIVE_TRANSCRIPT_OUTPUT_SILENCE_SECONDS: ${LIVE_TRANSCRIPT_OUTPUT_SILENCE_SECONDS:-20}
      OPENAI_LIVE_TRANSCRIBE_MODEL: ${OPENAI_LIVE_TRANSCRIBE_MODEL:-}
      LIVE_TRANSCRIPT_MAX_BYTES_PER_SECOND: ${LIVE_TRANSCRIPT_MAX_BYTES_PER_SECOND:-65536}
      LIVE_TRANSCRIPT_MAX_GLOBAL_CONNECTIONS: ${LIVE_TRANSCRIPT_MAX_GLOBAL_CONNECTIONS:-8}
      LIVE_TRANSCRIPT_MAX_CLINIC_CONNECTIONS: ${LIVE_TRANSCRIPT_MAX_CLINIC_CONNECTIONS:-8}
      LIVE_TRANSCRIPT_MAX_USER_CONNECTIONS: ${LIVE_TRANSCRIPT_MAX_USER_CONNECTIONS:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}

    volumes:
      - nightingale-operational-events:/var/lib/nightingale/operational-events

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NIGHTINGALE_SOURCE_COMMIT: ${NIGHTINGALE_SOURCE_COMMIT:-unknown}
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # External localhost and the internal Playwright hostname are same-origin TLS.
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:-localhost}`) || Host(`proxy`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true

  ai-worker:
    logging: *bounded-container-logging
    image: ${NIGHTINGALE_BACKEND_IMAGE:-backend:latest}
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
      NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-disabled}
      NOTIFICATION_WHATSAPP_PROVIDER: ${NOTIFICATION_WHATSAPP_PROVIDER:-disabled}
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:-nightingale-notification-webhook-local}
      NOTIFICATION_PUBLIC_BASE_URL: ${NOTIFICATION_PUBLIC_BASE_URL:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_SUBMITTED_STALE_SECONDS: ${NOTIFICATION_SUBMITTED_STALE_SECONDS:-900}
      NOTIFICATION_CONNECT_TIMEOUT_SECONDS: ${NOTIFICATION_CONNECT_TIMEOUT_SECONDS:-5}
      NOTIFICATION_REQUEST_TIMEOUT_SECONDS: ${NOTIFICATION_REQUEST_TIMEOUT_SECONDS:-15}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM: ${TWILIO_SMS_FROM:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_API_BASE_URL: ${TWILIO_API_BASE_URL:-https://api.twilio.com}
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      REMOTE_TEXT_EGRESS_ENABLED: ${REMOTE_TEXT_EGRESS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACT_MODEL: ${OPENAI_EXTRACT_MODEL:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      REMOTE_CONNECT_TIMEOUT_SECONDS: ${REMOTE_CONNECT_TIMEOUT_SECONDS:-5}
      REMOTE_FIRST_RESULT_TIMEOUT_SECONDS: ${REMOTE_FIRST_RESULT_TIMEOUT_SECONDS:-15}
      REMOTE_REQUEST_TIMEOUT_SECONDS: ${REMOTE_REQUEST_TIMEOUT_SECONDS:-30}
      AI_TEXT_JOB_TIMEOUT_SECONDS: ${AI_TEXT_JOB_TIMEOUT_SECONDS:-75}
      AI_JOB_LEASE_SECONDS: ${AI_JOB_LEASE_SECONDS:-300}
      AI_WORKER_ENABLED: ${AI_WORKER_ENABLED:-true}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-2}
      AI_WORKER_HEARTBEAT_MAX_AGE_SECONDS: ${AI_WORKER_HEARTBEAT_MAX_AGE_SECONDS:-30}
      PRESIDIO_REQUIRED: ${PRESIDIO_REQUIRED:-true}
      PRESIDIO_NLP_MODEL: ${PRESIDIO_NLP_MODEL:-en_core_web_sm}
      OBSERVABILITY_RETENTION_DAYS: ${OBSERVABILITY_RETENTION_DAYS:-30}
      EXTERNAL_PROXY_RETENTION_DAYS: ${EXTERNAL_PROXY_RETENTION_DAYS:-30}
      EXTERNAL_CONTAINER_RETENTION_DAYS: ${EXTERNAL_CONTAINER_RETENTION_DAYS:-30}
      EXTERNAL_APM_RETENTION_DAYS: ${EXTERNAL_APM_RETENTION_DAYS:-30}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE:-unqualified}
      EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID:-}
      IMPORTANCE_LEARNING_MODE: ${IMPORTANCE_LEARNING_MODE:-shadow}
      DATA_DECAY_ENABLED: ${DATA_DECAY_ENABLED:-true}
      DATA_DECAY_DRY_RUN: ${DATA_DECAY_DRY_RUN:-true}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-local}
      REMOTE_AUDIO_EGRESS_ENABLED: ${REMOTE_AUDIO_EGRESS_ENABLED:-false}
      STRICT_NO_AUDIO_EGRESS: ${STRICT_NO_AUDIO_EGRESS:-false}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      LOCAL_ASR_MODEL_DIR: ${LOCAL_ASR_MODEL_DIR:-}
      PYANNOTE_ENABLED: ${PYANNOTE_ENABLED:-false}
      PYANNOTE_MODEL_DIR: ${PYANNOTE_MODEL_DIR:-}
      LIVE_TRANSCRIPT_ENABLED: ${LIVE_TRANSCRIPT_ENABLED:-false}
      LIVE_TRANSCRIPT_PROVIDER: ${LIVE_TRANSCRIPT_PROVIDER:-disabled}
      LIVE_TRANSCRIPT_OUTPUT_SILENCE_SECONDS: ${LIVE_TRANSCRIPT_OUTPUT_SILENCE_SECONDS:-20}
      OPENAI_LIVE_TRANSCRIBE_MODEL: ${OPENAI_LIVE_TRANSCRIBE_MODEL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        NIGHTINGALE_SOURCE_COMMIT: ${NIGHTINGALE_SOURCE_COMMIT:-unknown}
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    command: ["python", "-m", "app.ai_worker"]
    restart: unless-stopped

volumes:
  nightingale-db-data:
  nightingale-operational-events:
