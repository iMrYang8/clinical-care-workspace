services:

  proxy:
    image: traefik:3.6
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - nightingale-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  prestart:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      # Production is the base configuration. compose.override.yml is the only
      # file that opts the local one-command workflow into synthetic demo data.
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Variable not set}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    command: ["bash", "scripts/prestart.sh"]
    restart: "no"

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      # The long-running API receives only the restricted, non-owner role.
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      REMOTE_TEXT_EGRESS_ENABLED: ${REMOTE_TEXT_EGRESS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACT_MODEL: ${OPENAI_EXTRACT_MODEL:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      AI_JOB_LEASE_SECONDS: ${AI_JOB_LEASE_SECONDS:-300}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-2}
      PRESIDIO_REQUIRED: ${PRESIDIO_REQUIRED:-true}
      PRESIDIO_NLP_MODEL: ${PRESIDIO_NLP_MODEL:-en_core_web_sm}
      IMPORTANCE_LEARNING_ENABLED: ${IMPORTANCE_LEARNING_ENABLED:-true}
      DATA_DECAY_ENABLED: ${DATA_DECAY_ENABLED:-true}
      DATA_DECAY_DRY_RUN: ${DATA_DECAY_DRY_RUN:-true}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-disabled}
      REMOTE_AUDIO_EGRESS_ENABLED: ${REMOTE_AUDIO_EGRESS_ENABLED:-false}
      STRICT_NO_AUDIO_EGRESS: ${STRICT_NO_AUDIO_EGRESS:-false}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      LOCAL_ASR_MODEL_DIR: ${LOCAL_ASR_MODEL_DIR:-}
      PYANNOTE_ENABLED: ${PYANNOTE_ENABLED:-false}
      PYANNOTE_MODEL_DIR: ${PYANNOTE_MODEL_DIR:-}
      LIVE_TRANSCRIPT_ENABLED: ${LIVE_TRANSCRIPT_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  ai-worker:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
      prestart:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: "production"
      ENABLE_DEMO_AUTH: "false"
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIELD_ENCRYPTION_MASTER_KEY: ${FIELD_ENCRYPTION_MASTER_KEY:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://nightingale_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/app
      AI_PROVIDER: ${AI_PROVIDER:-deterministic}
      REMOTE_TEXT_EGRESS_ENABLED: ${REMOTE_TEXT_EGRESS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EXTRACT_MODEL: ${OPENAI_EXTRACT_MODEL:-}
      OPENAI_REVIEW_MODEL: ${OPENAI_REVIEW_MODEL:-}
      AI_JOB_LEASE_SECONDS: ${AI_JOB_LEASE_SECONDS:-300}
      AI_WORKER_POLL_SECONDS: ${AI_WORKER_POLL_SECONDS:-2}
      PRESIDIO_REQUIRED: ${PRESIDIO_REQUIRED:-true}
      PRESIDIO_NLP_MODEL: ${PRESIDIO_NLP_MODEL:-en_core_web_sm}
      IMPORTANCE_LEARNING_ENABLED: ${IMPORTANCE_LEARNING_ENABLED:-true}
      DATA_DECAY_ENABLED: ${DATA_DECAY_ENABLED:-true}
      DATA_DECAY_DRY_RUN: ${DATA_DECAY_DRY_RUN:-true}
      VOICE_TRANSCRIPTION_PROVIDER: ${VOICE_TRANSCRIPTION_PROVIDER:-disabled}
      REMOTE_AUDIO_EGRESS_ENABLED: ${REMOTE_AUDIO_EGRESS_ENABLED:-false}
      STRICT_NO_AUDIO_EGRESS: ${STRICT_NO_AUDIO_EGRESS:-false}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-}
      LOCAL_ASR_MODEL_DIR: ${LOCAL_ASR_MODEL_DIR:-}
      PYANNOTE_ENABLED: ${PYANNOTE_ENABLED:-false}
      PYANNOTE_MODEL_DIR: ${PYANNOTE_MODEL_DIR:-}
      LIVE_TRANSCRIPT_ENABLED: ${LIVE_TRANSCRIPT_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_PRESIDIO_NLP: ${INSTALL_PRESIDIO_NLP:-false}
        INSTALL_LOCAL_ASR: ${INSTALL_LOCAL_ASR:-false}
        INSTALL_DIARIZATION: ${INSTALL_DIARIZATION:-false}
    command: ["python", "-m", "app.ai_worker"]
    restart: unless-stopped

volumes:
  nightingale-db-data:
