services:
  # Explicit opt-in only: add this file to a normal Compose command.
  proxy:
    ports:
      - "127.0.0.1:8090:8080"
    command:
      - --providers.docker
      - --providers.docker.exposedbydefault=false
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)'
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --entrypoints.traefik.address=:8080
      - --api.insecure=true
      # The opt-in dashboard must not weaken the production-safe access sink.
      # Keep only bounded operational fields; never raw URL/query/header data.
      - --accesslog
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --log
      - --log.level=INFO

  db:
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"

  backend:
    ports:
      - "127.0.0.1:8000:8000"

  mailpit:
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  playwright:
    ports:
      - "127.0.0.1:9323:9323"
