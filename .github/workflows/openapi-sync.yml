name: OpenAPI client sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create ephemeral CI environment
        run: ./scripts/setup-ci-env.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: uv sync --frozen --package app
      - run: bun ci --frozen-lockfile
      - name: OpenAPI schema must be a tracked release artifact
        run: git ls-files --error-unmatch frontend/openapi.json
      - run: bash scripts/generate-client.sh
      - name: Generated client must be committed
        run: git diff --exit-code -- frontend/openapi.json frontend/src/client
