name: Test Backend

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create ephemeral CI environment
        run: ./scripts/setup-ci-env.sh
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Before upgrading uv version, make sure astral-sh/setup-uv knows its checksum.
          # See: https://github.com/astral-sh/setup-uv/issues/851#issuecomment-4282017837
          version: "0.11.18"
      - name: Run backend contracts in a newly allocated Compose project
        run: |
          set -euo pipefail
          project="$(./scripts/temporary-project-name.sh test)"
          port="$(python3 ./scripts/free-local-port.py)"
          export NIGHTINGALE_CHECKOUT_FINGERPRINT="$(./scripts/demo-project-name.sh --fingerprint)"
          ./scripts/assert-compose-project-empty.sh "$project"
          created=false
          cleanup() {
            if [[ "$created" != true ]]; then return 0; fi
            ./scripts/assert-demo-project-ownership.sh "$project" --temporary
            DEV_DB_PORT="$port" docker compose --project-name "$project" \
              -f compose.yml -f compose.override.yml -f compose.dev-tools.yml \
              down --volumes --remove-orphans
          }
          trap 'cleanup || true' EXIT INT TERM
          created=true
          DEV_DB_PORT="$port" docker compose --project-name "$project" \
            -f compose.yml -f compose.override.yml -f compose.dev-tools.yml \
            up -d --wait db mailpit
          ./scripts/assert-demo-project-ownership.sh "$project" --temporary
          uv sync --frozen --package app --group presidio-nlp
          set -a
          source .env
          set +a
          export DATABASE_URL="postgresql://nightingale_app:${POSTGRES_APP_PASSWORD}@127.0.0.1:${port}/app"
          export MIGRATION_DATABASE_URL="postgresql://postgres:${POSTGRES_PASSWORD}@127.0.0.1:${port}/app"
          (
            cd backend
            uv run bash scripts/prestart.sh
            uv run bash scripts/tests-start.sh "Coverage for ${{ github.sha }}"
          )
        env:
          REQUIRE_PRESIDIO_MODEL_TEST: "true"
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        run: uv run coverage report --fail-under=90
        working-directory: backend
