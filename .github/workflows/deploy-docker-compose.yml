name: Deploy with Docker Compose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docker-compose
  cancel-in-progress: false

jobs:
  release-gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Verify release candidate
        run: BUN_BIN=bun ./scripts/verify-release.sh
      - run: printf '%s\n' "$GITHUB_SHA" > verified-sha.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sha-compose-${{ github.run_id }}
          path: verified-sha.txt
          retention-days: 1

  deploy:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' && needs.release-gates.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 30
    # Configure required reviewers and a main-only deployment branch policy in
    # the GitHub production environment before enabling this workflow.
    environment:
      name: production
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ vars.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      # Independent from POSTGRES_PASSWORD; never use the committed local value.
      POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
      INSTALL_PRESIDIO_NLP: ${{ vars.INSTALL_PRESIDIO_NLP }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      REMOTE_TEXT_EGRESS_ENABLED: ${{ vars.REMOTE_TEXT_EGRESS_ENABLED }}
      PRESIDIO_NLP_MODEL: ${{ vars.PRESIDIO_NLP_MODEL }}
      OPENAI_EXTRACT_MODEL: ${{ vars.OPENAI_EXTRACT_MODEL }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      NIGHTINGALE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified SHA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sha-compose-${{ github.run_id }}
          path: .verified-release
      - name: Refuse an unverified checkout
        run: |
          test "$(cat .verified-release/verified-sha.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build
        run: docker compose -f compose.yml -f compose.deploy.yml build
      - name: Prepare database
        run: docker compose -f compose.yml -f compose.deploy.yml run --rm prestart
      - name: Start application
        run: docker compose -f compose.yml -f compose.deploy.yml up -d
