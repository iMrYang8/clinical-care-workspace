name: Deploy with Docker Compose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the supported production deployment owns this serialized lane.
  group: production-main
  cancel-in-progress: false

jobs:
  release-gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NIGHTINGALE_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/nightingale-release-evidence
      # This must be a repository variable because the image is built and
      # verified before the protected production approval boundary.
      INSTALL_PRESIDIO_NLP: ${{ vars.INSTALL_PRESIDIO_NLP }}
      RELEASE_IMAGE_REF: nightingale-backend:${{ github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Verify complete current-SHA release candidate
        run: BUN_BIN=bun ./scripts/verify-release.sh --e2e --benchmark --ffmpeg
      - name: Bind live evidence to immutable SHA
        run: |
          test "$(cat "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/release-commit.txt")" = "$GITHUB_SHA"
          python - "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/glance-benchmark.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          assert evidence["commit"] == expected
          assert evidence["dirty"] is False
          assert evidence["compose"]["backend_image_revision"] == expected
          assert evidence["gate"]["p95_lte_300ms"] is True
          PY
          grep -Fxq "nightingale_source_commit=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          grep -Fxq "backend_image_revision_label=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          mkdir -p release-artifact
          cp "$NIGHTINGALE_RELEASE_EVIDENCE_DIR"/* release-artifact/
          printf '%s\n' "$GITHUB_SHA" > release-artifact/verified-sha.txt
      - name: Package the verified deployable release image once
        run: |
          set -euo pipefail
          benchmark_image_id="$(python - "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/glance-benchmark.json" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          print(evidence["compose"]["backend_image_digest"])
          PY
          )"
          ffmpeg_image_id="$(awk -F= '/^backend_image_id=/{print $2}' \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt")"
          source_image_id="$(docker image inspect --format '{{.Id}}' backend:latest)"
          grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$source_image_id"
          test "$source_image_id" = "$benchmark_image_id"
          test "$source_image_id" = "$ffmpeg_image_id"

          # Preserve the exact image that passed topology, benchmark, and
          # FFmpeg gates. The protected job must load, never rebuild, it.
          docker image tag "$source_image_id" "$RELEASE_IMAGE_REF"
          docker image save --output \
            release-artifact/nightingale-backend.oci.tar "$RELEASE_IMAGE_REF"
          archive_sha256="$(sha256sum \
            release-artifact/nightingale-backend.oci.tar | awk '{print $1}')"
          grep -Eq '^[0-9a-f]{64}$' <<<"$archive_sha256"
          printf '%s\n' "$source_image_id" > release-artifact/image-id.txt
          printf '%s\n' "$archive_sha256" > release-artifact/image-archive.sha256
          printf '%s\n' "$RELEASE_IMAGE_REF" > release-artifact/image-ref.txt
      - name: Upload current-SHA release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sha-compose-${{ github.run_id }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1

  protected-release:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' && needs.release-gates.result == 'success' }}
    runs-on: self-hosted
    timeout-minutes: 30
    # Configure required reviewers and a main-only deployment branch policy in
    # the GitHub production environment before enabling this workflow.
    environment:
      name: production
    env:
      DOMAIN: ${{ vars.DOMAIN }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ vars.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      # Independent from POSTGRES_PASSWORD; never use the committed local value.
      POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER }}
      REMOTE_TEXT_EGRESS_ENABLED: ${{ vars.REMOTE_TEXT_EGRESS_ENABLED }}
      PRESIDIO_NLP_MODEL: ${{ vars.PRESIDIO_NLP_MODEL }}
      OPENAI_EXTRACT_MODEL: ${{ vars.OPENAI_EXTRACT_MODEL }}
      OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      NIGHTINGALE_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified current-SHA evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sha-compose-${{ github.run_id }}
          path: .verified-release
      - name: Refuse an unverified checkout or stale evidence
        run: |
          test "$(cat .verified-release/verified-sha.txt)" = "$GITHUB_SHA"
          test "$(cat .verified-release/release-commit.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fxq "nightingale_source_commit=$GITHUB_SHA" \
            .verified-release/ffmpeg-container-version.txt
          python - .verified-release/glance-benchmark.json "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          assert evidence["commit"] == sys.argv[2]
          assert evidence["compose"]["backend_image_revision"] == sys.argv[2]
          assert evidence["gate"]["p95_lte_300ms"] is True
          PY
      - name: Load and verify the exact release image
        run: |
          set -euo pipefail
          expected_image_ref="$(cat .verified-release/image-ref.txt)"
          expected_image_id="$(cat .verified-release/image-id.txt)"
          expected_archive_sha256="$(cat .verified-release/image-archive.sha256)"
          test "$expected_image_ref" = "nightingale-backend:$GITHUB_SHA"
          grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$expected_image_id"
          grep -Eq '^[0-9a-f]{64}$' <<<"$expected_archive_sha256"
          actual_archive_sha256="$(sha256sum \
            .verified-release/nightingale-backend.oci.tar | awk '{print $1}')"
          test "$actual_archive_sha256" = "$expected_archive_sha256"

          docker image load --input .verified-release/nightingale-backend.oci.tar
          loaded_image_id="$(docker image inspect --format '{{.Id}}' \
            "$expected_image_ref")"
          test "$loaded_image_id" = "$expected_image_id"
          ffmpeg_version="$(docker run --rm --entrypoint ffmpeg \
            "$expected_image_id" -version 2>&1)"
          printf '%s\n' "$ffmpeg_version"
          grep -q '^ffmpeg version ' <<<"$ffmpeg_version"
          printf 'NIGHTINGALE_BACKEND_IMAGE=%s\n' "$expected_image_id" >> "$GITHUB_ENV"
      - name: Prepare database
        run: docker compose -f compose.yml -f compose.deploy.yml run --rm prestart
      - name: Start application and wait for declared service readiness
        run: |
          docker compose -f compose.yml -f compose.deploy.yml \
            up -d --wait --wait-timeout 180 proxy backend ai-worker
      - name: Verify HTTPS and worker readiness
        run: |
          set -euo pipefail
          : "${DOMAIN:?DOMAIN repository variable is required}"
          health="$(curl --fail --show-error --silent --retry 24 --retry-delay 5 \
            --retry-all-errors "https://${DOMAIN}/api/v1/utils/health-check/")"
          test "$health" = "true"
          curl --fail --show-error --silent "https://${DOMAIN}/" >/dev/null

          backend_id="$(docker compose -f compose.yml -f compose.deploy.yml ps -q backend)"
          worker_id="$(docker compose -f compose.yml -f compose.deploy.yml ps -q ai-worker)"
          test -n "$backend_id"
          test -n "$worker_id"
          test "$(docker inspect --format '{{.State.Running}}' "$worker_id")" = "true"
          test "$(docker inspect --format '{{.RestartCount}}' "$worker_id")" = "0"
          test "$(docker inspect --format '{{.Image}}' "$backend_id")" = "$NIGHTINGALE_BACKEND_IMAGE"
          test "$(docker inspect --format '{{.Image}}' "$worker_id")" = "$NIGHTINGALE_BACKEND_IMAGE"
          docker inspect --format '{{json .Config.Cmd}}' "$worker_id" | grep -q 'app.ai_worker'
          docker compose -f compose.yml -f compose.deploy.yml exec -T ai-worker \
            python -c "import app.ai_worker; from app.core.db import assert_restricted_runtime_database; assert_restricted_runtime_database()"
