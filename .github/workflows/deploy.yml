name: Validate FastAPI Cloud boundary (deployment disabled)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Share the only production lane with the supported Compose deployment.
  group: production-main
  cancel-in-progress: false

jobs:
  release-gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NIGHTINGALE_RELEASE_EVIDENCE_DIR: ${{ runner.temp }}/nightingale-release-evidence
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Verify complete current-SHA release candidate
        run: BUN_BIN=bun ./scripts/verify-release.sh --e2e --benchmark --ffmpeg
      - name: Bind live evidence to immutable SHA
        run: |
          test "$(cat "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/release-commit.txt")" = "$GITHUB_SHA"
          python - "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/glance-benchmark.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          assert evidence["commit"] == expected
          assert evidence["dirty"] is False
          assert evidence["compose"]["backend_image_revision"] == expected
          assert evidence["gate"]["p95_lte_300ms"] is True
          PY
          grep -Fxq "nightingale_source_commit=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          grep -Fxq "backend_image_revision_label=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          mkdir -p release-artifact
          cp "$NIGHTINGALE_RELEASE_EVIDENCE_DIR"/* release-artifact/
          printf '%s\n' "$GITHUB_SHA" > release-artifact/verified-sha.txt
      - name: Upload current-SHA release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sha-cloud-${{ github.run_id }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1

  protected-release:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' && needs.release-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Keep the approval boundary even though this path intentionally performs
    # no deployment. Protect this environment with reviewers and main-only use.
    environment:
      name: production
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified current-SHA evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sha-cloud-${{ github.run_id }}
          path: .verified-release
      - name: Refuse an unverified checkout
        run: |
          test "$(cat .verified-release/verified-sha.txt)" = "$GITHUB_SHA"
          test "$(cat .verified-release/release-commit.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fxq "nightingale_source_commit=$GITHUB_SHA" \
            .verified-release/ffmpeg-container-version.txt
          python - .verified-release/glance-benchmark.json "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          assert evidence["commit"] == sys.argv[2]
          assert evidence["compose"]["backend_image_revision"] == sys.argv[2]
          assert evidence["gate"]["p95_lte_300ms"] is True
          PY
      - name: Keep unsupported FastAPI Cloud deployment disabled
        run: |
          echo "FastAPI Cloud deployment disabled: Nightingale requires the API and a durable python -m app.ai_worker service."
          echo "Use the protected Docker Compose workflow for the complete production topology."
