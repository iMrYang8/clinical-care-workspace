name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Finish the active production migration/deploy before the newest main SHA.
  # GitHub retains only the latest pending member of a concurrency group, so an
  # older queued run cannot deploy after a newer commit.
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Verify release candidate
        run: BUN_BIN=bun ./scripts/verify-release.sh
      - name: Bind verification to immutable SHA
        run: printf '%s\n' "$GITHUB_SHA" > verified-sha.txt
      - name: Upload verified SHA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-sha-cloud-${{ github.run_id }}
          path: verified-sha.txt
          retention-days: 1

  deploy:
    needs: release-gates
    if: ${{ github.ref == 'refs/heads/main' && needs.release-gates.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Repository settings must protect this environment with required reviewers
    # and restrict deployment branches to main.
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified SHA
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-sha-cloud-${{ github.run_id }}
          path: .verified-release
      - name: Refuse an unverified checkout
        run: |
          test "$(cat .verified-release/verified-sha.txt)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend dependencies
        run: bun ci
      - name: Build frontend
        run: bun run --filter frontend build
        env:
          # Override frontend/.env so the deployed frontend uses the same origin as the API
          VITE_API_URL: ""
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.18"
      - name: Prepare database
        run: |
          : "${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL secret is required}"
          : "${DATABASE_URL:?DATABASE_URL secret is required}"
          : "${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD secret is required}"
          : "${FIELD_ENCRYPTION_MASTER_KEY:?FIELD_ENCRYPTION_MASTER_KEY secret is required}"
          uv run bash scripts/prestart.sh
        working-directory: backend
        env:
          FASTAPI_ENV: production
          ENABLE_DEMO_AUTH: "false"
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
      - name: Deploy to FastAPI Cloud
        run: uv run fastapi deploy
        env:
          FASTAPI_ENV: production
          ENABLE_DEMO_AUTH: "false"
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIELD_ENCRYPTION_MASTER_KEY: ${{ secrets.FIELD_ENCRYPTION_MASTER_KEY }}
