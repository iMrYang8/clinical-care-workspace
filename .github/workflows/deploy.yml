name: Verify FastAPI Cloud boundary (deployment disabled)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create ephemeral CI environment
        run: |
          ./scripts/setup-ci-env.sh
          echo "NIGHTINGALE_RELEASE_EVIDENCE_DIR=$RUNNER_TEMP/nightingale-release-evidence" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install audio preprocessing runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -version | head -n 1
      - name: Verify complete current-SHA release candidate
        run: BUN_BIN=bun ./scripts/verify-release.sh --e2e --benchmark --ffmpeg
      - name: Bind live evidence to immutable SHA
        run: |
          test "$(cat "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/release-commit.txt")" = "$GITHUB_SHA"
          python - "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/glance-benchmark.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = sys.argv[2]
          assert evidence["commit"] == expected
          assert evidence["dirty"] is False
          assert evidence["compose"]["backend_image_revision"] == expected
          assert evidence["gate"]["p95_lte_300ms"] is True
          PY
          grep -Fxq "nightingale_source_commit=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          grep -Fxq "backend_image_revision_label=$GITHUB_SHA" \
            "$NIGHTINGALE_RELEASE_EVIDENCE_DIR/ffmpeg-container-version.txt"
          mkdir -p release-artifact
          cp "$NIGHTINGALE_RELEASE_EVIDENCE_DIR"/* release-artifact/
          printf '%s\n' "$GITHUB_SHA" > release-artifact/verified-sha.txt
      - name: Upload current-SHA release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fastapi-cloud-boundary-${{ github.run_id }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1
      - name: Record the disabled deployment boundary
        run: |
          echo "FastAPI Cloud deployment disabled: Nightingale requires the API and a durable python -m app.ai_worker service."
          echo "This workflow is an unprivileged verifier; use the protected Docker Compose workflow for production."
