x-qualified-external-retention: &qualified-external-retention
  EXTERNAL_PROXY_RETENTION_DAYS: ${EXTERNAL_PROXY_RETENTION_DAYS:?Set verified proxy retention to 1-30 days}
  EXTERNAL_CONTAINER_RETENTION_DAYS: ${EXTERNAL_CONTAINER_RETENTION_DAYS:?Set verified container retention to 1-30 days}
  EXTERNAL_APM_RETENTION_DAYS: ${EXTERNAL_APM_RETENTION_DAYS:?Set verified APM retention to 1-30 days}
  EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE:?Set deployment_policy or provider_contract}
  EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID:?Set an inspectable policy or contract reference}

x-bounded-container-logging: &bounded-container-logging
  driver: local
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-20m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

services:

  proxy:
    restart: always
    logging: *bounded-container-logging
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "${NIGHTINGALE_PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${NIGHTINGALE_PRODUCTION_HTTP_PORT:-80}:80"
      # Listen on port 443, default for HTTPS
      - "${NIGHTINGALE_PRODUCTION_BIND_ADDRESS:-0.0.0.0}:${NIGHTINGALE_PRODUCTION_HTTPS_PORT:-443}:443"
    volumes:
      # Mount the volume to store the certificates
      - traefik-certificates:/certificates
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Never discover a parallel Compose project's identically named router.
      - '--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME}`)'
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Redirect all HTTP traffic to HTTPS
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Store the Let's Encrypt certificates in the mounted volume
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      # Use the TLS Challenge for Let's Encrypt
      - --certificatesresolvers.le.acme.tlschallenge=true
      # Keep only operational fields; never retain a raw URL/query/header.
      - --accesslog
      - --accesslog.format=json
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      # Enable the Traefik log, for configurations and errors
      - --log
    labels:
      com.nightingale.observability.proxy-retention-days: ${EXTERNAL_PROXY_RETENTION_DAYS:?Set verified proxy retention to 1-30 days}
      com.nightingale.observability.container-retention-days: ${EXTERNAL_CONTAINER_RETENTION_DAYS:?Set verified container retention to 1-30 days}
      com.nightingale.observability.apm-retention-days: ${EXTERNAL_APM_RETENTION_DAYS:?Set verified APM retention to 1-30 days}
      com.nightingale.observability.retention-evidence: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE:?Set deployment_policy or provider_contract}
      com.nightingale.observability.retention-evidence-id: ${EXTERNAL_OBSERVABILITY_RETENTION_EVIDENCE_ID:?Set an inspectable policy or contract reference}

  db:
    restart: always
    logging: *bounded-container-logging

  prestart:
    # Production callers must select a release image explicitly. The deploy
    # workflow replaces the initial SHA tag with its inspected image ID before
    # migration or application startup.
    image: ${NIGHTINGALE_BACKEND_IMAGE:?Set to a verified release image}
    environment:
      <<: *qualified-external-retention
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?Set an independent callback secret}
    logging: *bounded-container-logging

  backend:
    image: ${NIGHTINGALE_BACKEND_IMAGE:?Set to a verified release image}
    restart: always
    environment:
      <<: *qualified-external-retention
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?Set an independent callback secret}
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}
    logging: *bounded-container-logging
    labels:
      # Route HTTPS traffic for this domain
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      # Use the Let's Encrypt resolver
      - traefik.http.routers.backend-https.tls.certresolver=le

  ai-worker:
    image: ${NIGHTINGALE_BACKEND_IMAGE:?Set to a verified release image}
    restart: always
    environment:
      <<: *qualified-external-retention
      NOTIFICATION_WEBHOOK_SECRET: ${NOTIFICATION_WEBHOOK_SECRET:?Set an independent callback secret}
    logging: *bounded-container-logging

volumes:
  # Create a volume to store the certificates, even if the container is recreated
  traefik-certificates:
    labels:
      com.nightingale.checkout_fingerprint: ${NIGHTINGALE_CHECKOUT_FINGERPRINT:-unscoped}
  # The release verification topology is disposable only when both named
  # volumes carry this checkout fingerprint. Production keeps persistent data.
  nightingale-db-data:
    labels:
      com.nightingale.checkout_fingerprint: ${NIGHTINGALE_CHECKOUT_FINGERPRINT:-unscoped}
  nightingale-operational-events:
    labels:
      com.nightingale.checkout_fingerprint: ${NIGHTINGALE_CHECKOUT_FINGERPRINT:-unscoped}

networks:
  default:
    labels:
      com.nightingale.checkout_fingerprint: ${NIGHTINGALE_CHECKOUT_FINGERPRINT:-unscoped}
