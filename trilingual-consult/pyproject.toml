[project]
name = "trilingual-consult"
version = "0.1.0"
description = "Isolated multi-agent sandbox for SEA trilingual medical consults. Not Nightingale runtime. Synthetic gold only."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
audio = ["datasets>=3.0", "soundfile>=0.12"]
# Pinned to what the Nightingale backend already locks, so a number measured
# here transfers to the product path instead of describing a different decoder.
local-asr = ["faster-whisper>=1.1.0,<2.0.0"]

[project.scripts]
trilingual-consult = "trilingual_consult.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trilingual_consult"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "audio: streams Hugging Face slices (opt-in; default pytest skips)",
]
